name: macOS build and tests
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: macTools-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Swift and native tests
        run: make test
      - name: Package universal app
        env:
          MACTOOLS_ARCHS: arm64 x86_64
          MACTOOLS_VERSION: 0.2.${{ github.run_number }}
          MACTOOLS_BUILD_NUMBER: ${{ github.run_number }}
        run: make app
      - name: Verify bundle
        run: |
          plutil -lint dist/macTools.app/Contents/Info.plist
          codesign --verify --deep --strict dist/macTools.app
          lipo -verify_arch arm64 x86_64 dist/macTools.app/Contents/MacOS/macTools
          lipo -verify_arch arm64 x86_64 dist/macTools.app/Contents/Helpers/macToolsUpdate
      - name: Package release archive
        run: |
          ditto -c -k --norsrc --keepParent dist/macTools.app dist/macTools.zip
          cd dist
          shasum -a 256 macTools.zip > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: macTools-release
          path: |
            dist/macTools.zip
            dist/SHA256SUMS
  publish:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: macTools-release
          path: release
      - name: Publish immutable update
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          COMMIT_SHA: ${{ github.sha }}
          RELEASE_VERSION: 0.2.${{ github.run_number }}
        run: |
          if gh release view "build-$COMMIT_SHA" >/dev/null 2>&1; then
            echo "Diese unveränderliche Veröffentlichung ist bereits vorhanden."
            exit 0
          fi
          gh release create "build-$COMMIT_SHA" release/macTools.zip release/SHA256SUMS \
            --target "$COMMIT_SHA" --latest \
            --title "macTools $RELEASE_VERSION" \
            --notes "Automatischer macOS-Build für Apple Silicon und Intel. Enthält Spotlight-Starter und automatische Updates. Nach Änderungen am Tastaturfilter kann macOS eine erneute Bedienungshilfen-Freigabe verlangen."
